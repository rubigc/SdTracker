version: '3.8'

services:
  sdtracker:
    build: .
    ports:
      - "8089:8080"  # Go backend
      - "3001:3001"  # Node.js backend
      - "3000:3000"  # Frontend
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    environment:
      - SHOWDOWN_USERNAME=${SHOWDOWN_USERNAME:-default_user}
    environment:
      - DB_PATH=/app/database/pokemon_stats.db